# Cau hinh bo sung: giu camera, crop, weights va dataset trong project.yaml.
# Chay: python scripts/07_run_live.py --config config/inspection.yaml
yolo:
  confidence: 0.25

postprocess:
  roi:
    enabled: true
    path: config/bin_roi.json
    prompt_if_missing: true
    min_overlap: 0.80
    require_center: true
  surface:
    enabled: true
    path: data/calibration/bin_surface.npz
    capture_frames: 15
    reference_min_valid_fraction: 0.50
    mask_erode_px: 3
    min_mask_pixels: 30
    min_valid_points: 30
    min_height_mm: 5.0
    noise_sigma_multiplier: 3.0
    height_percentile: 90.0
    # RAISED / tong pixel MASK, khong phai RAISED / diem hop le.
    min_raised_ratio_mask: 0.02
    min_raised_points: 30
    # Ti le cap diem hien tai+nen can co de DUOC ket luan gan day.
    min_valid_ratio: 0.50
  duplicates:
    enabled: true
    mask_iou: 0.45
    containment: 0.80

runtime:
  scan_mode: manual
  interval_seconds: 2.0
  trigger_host: "127.0.0.1"
  trigger_port: 8765
  mask_fill: true
  mask_alpha: 0.22
  debug_rejected: false
