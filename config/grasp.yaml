# Cau hinh rieng cho GraspNet; khong thay config/project.yaml hay inspection.yaml.
backend:
  repo: third_party/graspnet-baseline
  checkpoint: models/graspnet/checkpoint-rs.tar
  device: cuda:0
  num_points: 20000
  num_views: 300
  seed: 42

data:
  mask_erode_px: 3
  neighbor_jump_mm: 12.0
  min_component_points: 64
  min_component_fraction: 0.0025
  min_target_points: 200
  min_retained_ratio: 0.50
  min_valid_mask_ratio: 0.30

gripper:
  name: robotiq_2f85_standard_fingers
  max_opening_mm: 85.0
  opening_margin_mm: 4.0
  # Chua co CAD, TCP, linkage cua tay kep that.

selection:
  min_score: 0.10
  seed_max_distance_mm: 10.0
  min_target_support_points: 30
  min_target_purity: 0.80
  closing_region_back_mm: 40.0
  max_candidates: 300
  candidates_per_object: 60
  per_object: 5
  nms_translation_mm: 15.0
  nms_rotation_deg: 20.0

collision:
  voxel_size_mm: 5.0
  approach_distance_mm: 50.0
  threshold: 0.01
  chunk_size: 8

output_dir: results/grasp_offline
