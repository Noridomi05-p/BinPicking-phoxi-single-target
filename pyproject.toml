[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phoxi-yolo-3d"
version = "0.2.0"
description = "Pure-Python PhoXi Gen2 + YOLO instance segmentation + 3D measurement pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python>=4.9,<5",
  "Pillow>=10,<13",
  "PyYAML>=6,<7",
  "scipy>=1.10,<2",
  "phoxi-api>=1.0,<2",
  "ultralytics>=8.3,<9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["phoxi_yolo3d*"]

[tool.ruff]
line-length = 100

